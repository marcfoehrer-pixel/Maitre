# Bauplan fuer Render.com — damit laeuft das Dashboard ohne eigenen Rechner.
#
# Einrichtung im Browser: Render mit dem GitHub-Konto verbinden, dieses
# Repository auswaehlen, Kennwort eingeben, fertig. Kein Terminal noetig.
#
# Der kostenlose Tarif legt den Dienst nach etwa 15 Minuten ohne Zugriff
# schlafen; der erste Aufruf danach dauert rund eine Minute. Deshalb ist die
# Aktualisierung hier auf 120 s gesetzt statt auf 60 s — im Schlaf laeuft
# ohnehin nichts, und seltenere Abrufe schonen die Portale.

services:
  - type: web
    name: aktien-dashboard
    runtime: node
    plan: free
    region: frankfurt
    branch: claude/stock-forecast-dashboard-lmn641
    buildCommand: "echo 'keine Abhaengigkeiten zu installieren'"
    startCommand: "node stocks/server.js --public"
    healthCheckPath: /healthz
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DASHBOARD_PASSWORD
        sync: false          # wird bei der Einrichtung abgefragt
      # Ohne diesen Schluessel bleibt nur Yahoo — und Yahoo weist Anfragen aus
      # Rechenzentren wegen ihrer Herkunft ab, nicht wegen ihrer Menge. Im
      # Internet-Betrieb ist der Schluessel daher praktisch Voraussetzung.
      # Kostenlos unter twelvedata.com, 800 Abrufe je Tag.
      - key: TWELVEDATA_API_KEY
        sync: false
      - key: REFRESH
        value: "180"
      # Titelzahl und Haltedauer bestimmen zusammen die Last:
      # 20 Titel bei 15 Minuten Haltedauer sind rund 80 Abfragen je Stunde.
      # Da ausserhalb der Handelszeiten gar nicht abgerufen wird, bleibt der
      # Tagesverbrauch unter den 800 Abrufen des kostenlosen Tarifs.
      - key: LIMIT
        value: "20"
      - key: CANDLE_TTL_MIN
        value: "15"
